<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ميزانية العائلة</title>

  <!-- إعدادات الشاشة الكاملة وإخفاء شريط المتصفح -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="الميزانية">
  <meta name="theme-color" content="#fef9c3">

  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">

  <!-- الربط بملف الـ Manifest المستقل -->
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #fef9c3;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzBPivIuoXf74anBZ__opOBNcRRPUv0HSezlminp3MVwMDYN-lXewjvKWg-fOjprT_k/exec" 
    allow="microphone; camera" 
    allowfullscreen>
  </iframe>

  <script>
    // تفعيل Service Worker المطلوب إجبارياً من كروم لوضع ملء الشاشة Standalone
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmaXRjaCcsIGZ1bmN0aW9uKGV2ZW50KSB7fSk7')
          .catch(() => {});
      });
    }

    // جسر الصوت عبر postMessage
    const frame = document.getElementById('appFrame');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ar-MA';
      recognition.interimResults = false;

      recognition.onstart = function() {
        isListening = true;
        frame.contentWindow.postMessage({ type: 'VOICE_RECORD_START' }, '*');
      };

      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        frame.contentWindow.postMessage({ type: 'VOICE_RECORD_RESULT', transcript: text }, '*');
      };

      recognition.onerror = function() {
        frame.contentWindow.postMessage({ type: 'VOICE_RECORD_STOP' }, '*');
        isListening = false;
      };

      recognition.onend = function() {
        isListening = false;
        frame.contentWindow.postMessage({ type: 'VOICE_RECORD_STOP' }, '*');
      };
    }

    window.addEventListener('message', function(event) {
      if (event.data && event.data.action === 'TOGGLE_VOICE') {
        if (!SpeechRecognition) return;
        if (isListening) {
          recognition.stop();
        } else {
          try { recognition.start(); } catch(err) {}
        }
      }
    });
  </script>
</body>
</html>
