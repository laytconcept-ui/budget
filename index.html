  <title>ميزانية العائلة</title>

  <!-- إعدادات ملء الشاشة للهواتف لمنع ظهور شريط المتصفح وتنبيهات جوجل -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ميزانية العائلة">
  <meta name="theme-color" content="#020617">

  <!-- أيقونة التطبيق الرسمية -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">

  <!-- ملف تعريف التطبيق المدمج (Manifest) لتفعيل التثبيت كـ PWA حقيقي على أندرويد -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "ميزانية العائلة",
    "short_name": "الميزانية",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#020617",
    "theme_color": "#020617",
    "icons": [
      {
        "src": "https://cdn-icons-png.flaticon.com/512/2382/2382461.png",
        "sizes": "512x512",
        "type": "image/png",
        "purpose": "any maskable"
      }
    ]
  }'>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
