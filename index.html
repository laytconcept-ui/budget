<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ميزانية العائلة</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="الميزانية">
  <meta name="theme-color" content="#fef9c3">

  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Cairo', sans-serif; 
    }
    
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #fef9c3; 
      display: flex; 
      flex-direction: column; 
    }

    .top-voice-bar {
      width: 100%;
      background: #fef08a;
      border-bottom: 2px solid #fde047;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 99999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .app-title {
      font-size: 13px;
      font-weight: 900;
      color: #854d0e;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      max-width: 60%;
    }

    .voice-btn-top {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.3);
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .voice-btn-top:active { 
      transform: scale(0.95); 
    }

    .recording-active {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      box-shadow: 0 3px 12px rgba(239, 68, 68, 0.5) !important;
      animation: pulse-red 1.2s infinite;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .iframe-container { 
      flex: 1; 
      width: 100%; 
      height: 100%; 
      position: relative; 
    }

    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block; 
    }
  </style>
</head>
<body>

  <!-- شريط المساعد الصوتي العلوي -->
  <div class="top-voice-bar">
    <div class="app-title">
      <span>🎙️</span>
      <span id="headerStatusText">المساعد الصوتي المباشر</span>
    </div>
    
    <button id="directVoiceBtn" class="voice-btn-top" onclick="startDirectVoice()">
      <span id="micIcon" style="font-size: 14px;">🎤</span>
      <span id="micBtnText">تحدث للتسجيل</span>
    </button>
  </div>

  <!-- إطار تطبيق الميزانية -->
  <div class="iframe-container">
    <iframe 
      id="appFrame"
      name="appFrame"
      src="https://script.google.com/macros/s/AKfycbzBPivIuoXf74anBZ__opOBNcRRPUv0HSezlminp3MVwMDYN-lXewjvKWg-fOjprT_k/exec" 
      allow="microphone; camera" 
      allowfullscreen>
    </iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmaXRjaCcsIGZ1bmN0aW9uKGV2ZW50KSB7fSk7').catch(() => {});
      });
    }

    const frame = document.getElementById('appFrame');
    const directVoiceBtn = document.getElementById('directVoiceBtn');
    const micBtnText = document.getElementById('micBtnText');
    const headerStatusText = document.getElementById('headerStatusText');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    let resetTimer = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ar-MA';
      recognition.interimResults = false;

      recognition.onstart = function() {
        isListening = true;
        clearTimeout(resetTimer);
        directVoiceBtn.classList.add('recording-active');
        micBtnText.innerText = "توقف";
        headerStatusText.innerText = "🎧 جارٍ الاستماع...";
        headerStatusText.style.color = "#dc2626";
      };

      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        headerStatusText.innerText = "✅ " + text;
        headerStatusText.style.color = "#15803d";
        
        // إرسال النص إلى التطبيق الداخلي
        sendVoiceMessage(text);

        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
          headerStatusText.innerText = "المساعد الصوتي المباشر";
          headerStatusText.style.color = "#854d0e";
        }, 3500);
      };

      recognition.onerror = function() {
        headerStatusText.innerText = "⚠️ حاول مرة أخرى";
        headerStatusText.style.color = "#b45309";
        stopRecording();
      };

      recognition.onend = function() {
        stopRecording();
      };
    }

    // دالة إرسال النص للإطار الداخلي
    function sendVoiceMessage(text) {
      const payloadObj = { type: 'VOICE_INPUT', text: text };
      const payloadStr = JSON.stringify(payloadObj);

      // 1. الإرسال لنافذة الـ iframe
      try {
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage(payloadObj, '*');
          frame.contentWindow.postMessage(payloadStr, '*');
          frame.contentWindow.postMessage(text, '*');
        }
      } catch(e) {}

      // 2. إرسال شامل لجميع الإطارات المفتوحة
      try {
        for (let i = 0; i < window.frames.length; i++) {
          try {
            window.frames[i].postMessage(payloadObj, '*');
            window.frames[i].postMessage(payloadStr, '*');
            window.frames[i].postMessage(text, '*');
          } catch(err) {}
        }
      } catch(e) {}
    }

    function startDirectVoice() {
      if (!SpeechRecognition) {
        alert('يرجى فتح الصفحة عبر متصفح Google Chrome.');
        return;
      }

      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch(e) {
          console.error(e);
        }
      }
    }

    function stopRecording() {
      isListening = false;
      directVoiceBtn.classList.remove('recording-active');
      micBtnText.innerText = "تحدث للتسجيل";
    }
  </script>
</body>
</html>
